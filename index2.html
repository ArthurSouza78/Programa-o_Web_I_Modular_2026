<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas de produtos</title>
</head>
<body>
    <table border="5">
      
             <caption><strong>Tabela de produtos</strong></caption>
             
        <thead>
            <tr>
                <th>Produto</th>
            <th>Preço</th>
            <th>Quantidade</th>
            <th>Total</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Arroz</td>
                <td>R$20,00</td>
                <td align="center">5</td>
                <td>R$100,00</td>
            </tr>
             <tr>
                <td>Feijão</td>
                <td>R$10,00</td>
                <td align="center">3</td>
                <td>R$30,00</td>
            </tr>
             <tr>
                <td>Macarrão</td>
                <td>R$8,00</td>
                <td align="center">4</td>
                <td>R$32,00</td>
            </tr>
             <tr>
                <td>Açucar 5kg</td>
                <td>R$20,00</td>
                <td align="center">5</td>
                <td>R$100,00</td>
            </tr>
             <tr>
                <td>Margarina</td>
                <td>R$7,00</td>
                <td align="center">3</td>
                <td>R$21,00</td>
            </tr>
             <tr>
                <td>Bandeja de Ovos</td>
                <td>R$30,00</td>
                <td align="center">4</td>
                <td>R$120,00</td>
            </tr>
             
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3"><strong><mark>Total R$ em Itens</mark></strong></td>
                <td><strong><em><mark>R$403,00</mark></em></strong></td>
            </tr>
        </tfoot>


    </table>
</body>
</html>
