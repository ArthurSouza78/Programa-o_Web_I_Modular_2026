<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário em HTML</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Formulário em HTML</h1>
    <form action="#" method="post">

        <fieldset>
            <legend>Cadastro do usuário</legend>
        

        <label for="nomeUser">Escreva o seu nome</label>
        <input type="text" id="nomeUser" name="nome" required placeholder="Digite seu nome."> 

        <br><br>

        <label for="telUser">Digite o seu telefone.</label>
        <input type="tel" id="telUser" name="tel" pattern="[0-9]{2}[0-9]{9}" required placeholder="Digite seu telefone."> 

        <br><br>

        <label for="UserEmail">Email de contato</label> <!--toda tag label é amarrado a uma tag input-->
        <input type="email" id="UserEmail" name="email" required placeholder="Digite seu email.">
       
        <br> <br>

        <label for="Usersenha">Senha</label>
        <input type="senha" id="Usersenha" name="senha" required placeholder="Digite sua senha.">

        <br><br>

        <label for="Usersexo">Selecione seu gênero</label>
        <br><br>
        <input type="radio" required id="masc" value="Masculino">
        <label for="masc">Masculino</label>

        <br><br>

        <input type="radio" required id="feme" value="Feminino">
        <label for="masc">Feminino</label>
        

        </fieldset>
        <fieldset>
            <legend>Dados do curso</legend>

        </fieldset>
        <br>
        <button type="submit">Entrar</button>



    </form>
</body>
</html>
