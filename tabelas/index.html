<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas HTML</title>
</head>
<body>
    <header>
        <h1>Elementos básicos de uma HTML </h1>
    </header>
     <table border="5">
        <caption> <strong>Usuários matriculados</strong></caption>
       <thead>
         <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Sexo</th>
        </tr>
       </thead>
        
       <tbody>
        <tr>
            <td align="center">Gilmar</td>
            <td align="center">40</td>
            <td rowspan="4" align="center">M</td>
        <tr>
            <td align="center">Antonio</td>
            <td align="center">35</td>
        
        </tr>
        <tr>
            <td align="center">Zezin</td>
            <td align="center">23</td>
        
        </tr>
        <tr>
            <td align="center">Toin</td>
            <td align="center">52</td>
        
        </tr>
       </tbody>

        <tfoot>
            <tr>
            <td align="center">Quantidade de usuários</td>
            <td colspan="2" align="center"><mark>4</mark></td>
        </tr>
        </tfoot>
            
        </table>
    
</body>
</html>
